name: Sync DeepSeek Harness upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-harness-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out automation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out target fork with repository-scoped deploy key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: StormPhoenix/deepseek-harness
          ref: master
          path: target
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
      - name: Fast-forward master and synchronize upstream tags
        shell: bash
        run: bash scripts/sync.sh target https://github.com/deepseek-ai/deepseek-harness.git
